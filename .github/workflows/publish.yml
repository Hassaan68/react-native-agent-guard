name: Manual npm Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'NPM distribution tag (e.g., latest, next)'
        required: true
        default: 'latest'

jobs:
  manual-publish:
    name: Publish Manually via UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Build distribution bundles
        run: pnpm build

      - name: Publish to npm
        run: pnpm publish --access public --tag ${{ github.event.inputs.tag }} --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}