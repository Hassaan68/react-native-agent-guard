name: Bug Report
description: Report a bug, unexpected policy behavior, schema export issue, or React Native UI problem.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug in `react-native-agent-guard`! Please fill out the details below so we can reproduce and fix the issue quickly.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "When executing a tool with a dynamic 'confirm' policy and stringified JSON..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction Code / Steps
      description: Provide a minimal code snippet or step-by-step instructions to reproduce the issue.
      placeholder: |
        const registry = createToolRegistry();
        registry.register('my_tool', {
          description: '...',
          inputSchema: z.object({ amount: z.number() }),
          policy: 'confirm',
          handler: async (input) => input,
        });
        const res = await registry.execute('my_tool', '{"amount": 100}');
      render: tsx
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect `react-native-agent-guard` to do?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior / Error Output
      description: What actually happened? Include any `ToolExecutionResult`, stack traces, or TypeScript compiler errors.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected Component
      description: Which part of `react-native-agent-guard` is affected?
      options:
        - ToolRegistry / execute()
        - Policy Evaluation (auto / confirm / biometric / deny)
        - Zod Validation / llmFeedback
        - AgentApprovalProvider / AgentApprovalSheet (React Native UI)
        - Schema Exporters (toOpenAITools / toClaudeTools / toMCPTools)
        - Built-In Mobile Presets
        - Audit Logging / AuditStorageAdapter
        - TypeScript Types / Build
    validations:
      required: true

  - type: input
    id: package_version
    attributes:
      label: react-native-agent-guard Version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: rn_version
    attributes:
      label: React Native & Expo Version
      placeholder: "react-native 0.76.x / Expo SDK 52"
    validations:
      required: true

  - type: input
    id: zod_version
    attributes:
      label: Zod Version
      placeholder: "4.x"
    validations:
      required: true

  - type: checkboxes
    id: platforms
    attributes:
      label: Target Platform(s)
      options:
        - label: iOS
        - label: Android
        - label: React Native Web / Node (Jest)
